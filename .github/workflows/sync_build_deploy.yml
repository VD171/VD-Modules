# ======================================================================
#
#  HOW A RELEASE LANDS (full picture in docs/ARCHITECTURE.md):
#    1. A module repo bumps its own update_to JSON and publishes a GitHub
#       release asset (the flashable zip).
#    2. Every 6h this workflow runs `mmrl-util sync`: for each module it
#       reads modules/<id>/track.yaml:update_to and APPENDS any version
#       whose versionCode is HIGHER than the feed head, downloading the
#       asset into modules/<id>/ and refreshing update.json + modules.json.
#       Only-higher is why a stale sync source silently freezes a module;
#       tools/index-check.sh guards against exactly that.
#    3. `mmrl-util index --push` commits and pushes the refreshed index.
#    4. Jekyll builds the repo into _site; the orphan `vdlu-feed` branch
#       (content-addressed VDLU blobs) is overlaid raw on top.
#    5. GitHub Pages deploys _site. The feed keeps a trailing window of the
#       3 newest versions per module (contiguous by versionCode).
#
#  Action pinning: this workflow deliberately tracks the moving MAJOR tags
#  of first-party actions/* (actions/checkout@v4, etc.). They are trusted,
#  and moving majors pick up security patches automatically. Pin to a full
#  commit SHA only if a supply-chain policy later requires it.

name: sync-build-deploy
on:
  schedule:
    - cron: '0 */6 * * *'

  workflow_dispatch:
   inputs:
      run_sync:
        description: "Run Sync"
        type: choice
        required: true
        default: 'No'
        options:
         - 'Yes'
         - 'No'

# Least privilege: the default token can only READ. Each job below widens
# the scope to exactly what it needs (sync -> write the index; deploy -> Pages).
permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  IS_SYNC: ${{ inputs.run_sync == 'Yes' || github.event_name == 'schedule' }}

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # mmrl-util index --push commits the refreshed feed
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Git
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mmrl-util

      - name: Index consistency guard
        run: |
          chmod +x tools/index-check.sh
          ./tools/index-check.sh

      - name: Sync
        if: ${{ env.IS_SYNC == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mmrl-util sync --size 95 --diff versions_diff.md

      - name: Write versions diff to summary
        if: ${{ env.IS_SYNC == 'true' }}
        run: |
          if [ -f versions_diff.md ]; then
            echo "## Versions Diff" >> $GITHUB_STEP_SUMMARY
            echo "$(cat versions_diff.md)" >> $GITHUB_STEP_SUMMARY
            rm versions_diff.md
          fi

      - name: Write latest versions to summary
        if: ${{ env.IS_SYNC != 'true' }}
        run: |
          mmrl-util index --list > latest_versions.md
          echo "## Latest Versions" >> $GITHUB_STEP_SUMMARY
          echo "$(cat latest_versions.md)" >> $GITHUB_STEP_SUMMARY
          rm latest_versions.md

      - name: Index and Push
        if: ${{ env.IS_SYNC == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mmrl-util index --push

      - name: Upload logs
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: log/*.log

  build:
    runs-on: ubuntu-latest
    needs: sync
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      # The VDLU incremental-update feeds live on the orphan `vdlu-feed` branch
      # (content-addressed blobs + signed manifests, reproducible from pack). They
      # are overlaid AFTER Jekyll so the blobs are served byte-for-byte, unprocessed.
      - name: Checkout VDLU feeds
        uses: actions/checkout@v4
        with:
          ref: vdlu-feed
          path: .vdlu-feed

      - name: Overlay VDLU feeds into site
        run: |
          # jekyll-build-pages runs in a container and leaves _site owned by root,
          # so this step (the runner user) needs sudo to write into it.
          shopt -s nullglob
          for d in .vdlu-feed/*/; do
            sudo cp -r "$d" "./_site/$(basename "$d")"
          done
          # .nojekyll tells Pages to serve the built artifact verbatim, so the
          # content-addressed VDLU blobs (underscore-prefixed names included) are
          # never reprocessed or dropped by a second Jekyll pass.
          sudo touch ./_site/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
